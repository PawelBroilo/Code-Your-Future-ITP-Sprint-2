<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Form</title>
</head>
<body>
<form>
<div>
<fieldset>
<legend>Personal Details</legend>

 <label for="name">Personal Details</label><br>   
  Name:
  <input type="text" id="name" name="name">
    <label for="age">Age:</label>
    <input type="number" id="age" name="age" title="Enter your age" placeholder="Enter your age"><br>
</div>
</fieldset>
</form>
<fieldset>
<div>
<legend>Comment Information</legend>
    <label for="comment">Comment Information</label><br>
Comment:
  <input type="text" id="comment" name="comment">
<label for="email">Email:</label>
  <input type="email" id="email" name="email" title="Enter your email address" placeholder="Enter your email"><br>
</div>
</fieldset>
</form>
</body>
</html>
